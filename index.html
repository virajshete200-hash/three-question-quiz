<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three-question quiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="quiz">
    <header>
      <p class="eyebrow">Web development practice</p>
      <h1>Three-question quiz</h1>
      <p class="intro">Choose one answer for each question. Your score appears at the end.</p>
    </header>

    <section class="quiz-panel" aria-labelledby="question">
      <p id="progress" class="progress" aria-live="polite">Question 1 of 3</p>
      <h2 id="question"></h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <div class="actions">
        <button id="next" type="button" disabled>Next question</button>
        <button id="restart" class="secondary" type="button" hidden>Restart quiz</button>
      </div>
      <p id="score" class="score" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
